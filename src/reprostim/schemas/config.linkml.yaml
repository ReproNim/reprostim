# LinkML schema of the ReproStim YAML config file (reprostim -c/--config).
#
# PROTOTYPE: currently covers the global "reprostim" section and the
# "bids-inject" command section only, used for runtime validation.
#
# Notes on mapping the config file to this schema:
#  - Slot names are Click *parameter names* (snake_case), e.g. the
#    --ignore-path option is the "ignore_paths" slot. The loader accepts "-"
#    and "_" interchangeably, so a config file key such as "log-level",
#    "ignore-paths" or the section name "bids-inject" must be normalized to
#    "_" before validating against this schema.
#  - Unknown keys are validation errors (typo detection): the LinkML JSON Schema
#    generator/validator treats classes as closed by default.
#  - Click choices are case-insensitive, enums here list lowercase values
#    (log levels uppercase, as in the CLI) and expect normalized input.
#  - YAML 1.1 (PyYAML) parses unquoted yes/no as booleans: write
#    `lock: "yes"` (quoted) in the config file.

id: https://github.com/ReproNim/reprostim/schemas/config
name: reprostim_config
title: ReproStim config
description: >-
  Schema of the ReproStim YAML config file overriding default values of the
  global options and of the sub-command options.
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  reprostim: https://github.com/ReproNim/reprostim/schemas/config/

default_prefix: reprostim
default_range: string

imports:
  - linkml:types

classes:

  ReprostimConfig:
    description: Root of the ReproStim config file.
    tree_root: true
    slots:
      - reprostim
      - bids_inject

  ReprostimGlobalConfig:
    description: >-
      Global options of the main "reprostim" entrypoint (section "reprostim").
    slots:
      - log_level
      - log_format

  BidsInjectConfig:
    description: >-
      Options of the "bids-inject" command (section "bids-inject"). Every slot
      matches the Click option of the same parameter name.
    slots:
      - videos
      - dataset
      - recursive
      - buffer_before
      - buffer_after
      - buffer_policy
      - time_offset
      - qr
      - layout
      - reprostim_timezone
      - bids_timezone
      - match
      - ignore_paths
      - dry_run
      - overwrite
      - lock
      - metadata_only
      - verbose

slots:

  # --- root sections ---------------------------------------------------

  reprostim:
    description: Global options section.
    range: ReprostimGlobalConfig

  bids_inject:
    description: Options of the "bids-inject" command (config section "bids-inject").
    range: BidsInjectConfig

  # --- global options --------------------------------------------------

  log_level:
    description: Logging level (-l / --log-level).
    range: LogLevel
    ifabsent: string(INFO)

  log_format:
    description: >-
      Logging format string (-f / --log-format), see Python
      logging.Formatter.
    range: string

  # --- bids-inject options ---------------------------------------------

  videos:
    description: >-
      Path to videos.tsv produced by video-audit (-f / --videos). Required by
      the command; can be provided here or on the command line.
    range: string

  dataset:
    description: >-
      Home directory of the BIDS dataset being injected into (-d / --dataset).
    range: string
    ifabsent: string(.)

  recursive:
    description: >-
      Recurse into subdirectories to find all *_scans.tsv files
      (-r / --recursive).
    range: boolean
    ifabsent: "false"

  buffer_before:
    description: >-
      Extra video to include before scan onset (-b / --buffer-before).
      Seconds (e.g. 10 or 10.5) or ISO 8601 duration (e.g. PT10S).
    any_of:
      - range: float
      - range: Duration
    ifabsent: string(0)

  buffer_after:
    description: >-
      Extra video to include after scan end (-a / --buffer-after).
      Seconds (e.g. 10 or 10.5) or ISO 8601 duration (e.g. PT10S).
    any_of:
      - range: float
      - range: Duration
    ifabsent: string(0)

  buffer_policy:
    description: Policy for buffer overflow beyond video boundaries (-p / --buffer-policy).
    range: BufferPolicy
    ifabsent: string(flexible)

  time_offset:
    description: >-
      Clock offset in seconds added to BIDS scan times (-t / --time-offset).
    range: float
    ifabsent: float(0.0)

  qr:
    description: QR code-based timing refinement mode (-q / --qr).
    range: QrMode
    ifabsent: string(none)

  layout:
    description: Output file placement layout (-l / --layout).
    range: LayoutMode
    ifabsent: string(nearby)

  reprostim_timezone:
    description: >-
      Timezone of naive ReproStim timestamps in videos.tsv
      (-z / --reprostim-timezone): "local" or an IANA name.
    range: string
    ifabsent: string(local)

  bids_timezone:
    description: >-
      Timezone of naive BIDS acq_time values in _scans.tsv
      (-Z / --bids-timezone): "local" or an IANA name.
    range: string
    ifabsent: string(local)

  match:
    description: >-
      Regular expression matched against the filename of each scan record
      (-m / --match).
    range: string
    ifabsent: string(.*)

  ignore_paths:
    description: >-
      Files, directories or glob patterns to skip, relative to the dataset
      directory (-i / --ignore-path, repeatable).
    range: string
    multivalued: true

  dry_run:
    description: Analyse only, do not write any output (-n / --dry-run).
    range: boolean
    ifabsent: "false"

  overwrite:
    description: Policy for handling existing output files (-w / --overwrite).
    range: OverwriteMode
    ifabsent: string(skip)

  lock:
    description: >-
      Whether to acquire the videos.tsv file lock (-k / --lock). Quote the
      value in YAML ("yes"/"no") to avoid boolean conversion.
    range: LockMode
    ifabsent: string(yes)

  metadata_only:
    description: >-
      Refresh _scans.tsv/scans.json annotations for already-generated media
      only (-M / --metadata-only).
    range: boolean
    ifabsent: "false"

  verbose:
    description: Enable verbose output (-v / --verbose).
    range: boolean
    ifabsent: "false"

types:

  Duration:
    description: >-
      Number of seconds as a string (e.g. "10", "10.5") or an ISO 8601
      duration (e.g. "PT10S").
    typeof: string
    pattern: '^(\d+(\.\d+)?|P(?=\d|T\d)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?)$'

enums:

  LogLevel:
    permissible_values:
      DEBUG:
      INFO:
      WARNING:
      ERROR:
      CRITICAL:

  BufferPolicy:
    permissible_values:
      strict:
        description: Error if buffers extend beyond video boundaries.
      flexible:
        description: Trim buffers to fit within video boundaries.

  QrMode:
    permissible_values:
      none:
        description: Timing based solely on acq_time and time_offset.
      auto:
        description: Use QR data if available, fall back to NTP timing.
      embed-existing:
        description: Use pre-existing parsed QR JSONL files; error if missing.
      parse:
        description: Run qr-parse on-the-fly on the source video.

  LayoutMode:
    permissible_values:
      nearby:
        description: Place output next to the corresponding NIfTI file.
      top-stimuli:
        description: Place output under a top-level stimuli/ directory.

  OverwriteMode:
    permissible_values:
      skip:
        description: Skip the scan if output already exists.
      force:
        description: Remove existing file/symlink then re-inject.
      always:
        description: Run split-video without an existence check.
      error:
        description: Treat existing output as an error.

  LockMode:
    permissible_values:
      "yes":
      "no":
